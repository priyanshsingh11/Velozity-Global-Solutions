# One-command local setup:
#   cp .env.docker.example .env && docker compose up --build
#   docker compose exec backend npx prisma db seed
#
# Frontend  -> http://localhost:5173
# API       -> http://localhost:5000/api
# Postgres  -> localhost:5432

services:
  postgres:
    image: postgres:16-alpine
    container_name: velozity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velozity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velozity_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-velozity}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-velozity} -d ${POSTGRES_DB:-velozity}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: velozity-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-velozity}:${POSTGRES_PASSWORD:-velozity_dev_password}@postgres:5432/${POSTGRES_DB:-velozity}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-velozity}:${POSTGRES_PASSWORD:-velozity_dev_password}@postgres:5432/${POSTGRES_DB:-velozity}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    ports:
      - '5000:5000'
    # Apply the schema, then boot. `db push` keeps first-run setup to a single
    # command; see the README for the migration-based workflow.
    command: sh -c "npx prisma db push --skip-generate && node dist/server.js"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty: nginx in the frontend container reverse-proxies /api and
        # /socket.io to the backend service, keeping everything same-origin.
        VITE_API_URL: ''
    container_name: velozity-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  postgres_data:
